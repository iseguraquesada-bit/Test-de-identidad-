/* ================= SCORING ================= */
function scoreAll(answers){
  var ch={controladora:0,salvadora:0,invisible:0,proveedora:0,exitosaVacia:0,espiritualReprimida:0};
  var cv={},pain=0,pn=0,disp=0,fd={};
  answers.forEach(function(a){
    var q=null;for(var i=0;i<QS.length;i++)if(QS[i].id===a.qid){q=QS[i];break;}
    if(!q)return;var o=q.opts[a.oi];if(!o)return;
    if(q.type==="i"){(o.chars||[]).forEach(function(c){if(c in ch)ch[c]+=(o.w||0);});if(o.con)cv[o.con]=(cv[o.con]||0)+1;}
    if(q.type==="f")fd[q.id]=o;
    if(o.pain!==undefined){pain+=o.pain;pn++;}
    if(o.disp!==undefined)disp+=o.disp;
  });
  var sorted=ORDER.map(function(k){return[k,ch[k]];}).sort(function(a,b){return b[1]-a[1];});
  var max=sorted[0][1]||1;
  var meters=sorted.filter(function(s){return s[1]>0;}).slice(0,4).map(function(s){return{key:s[0],name:CHARS[s[0]].name,pct:Math.max(14,Math.round(s[1]/max*100))};});
  var priKey=sorted[0][0];
  var secKey=sorted[1][1]>=sorted[0][1]*0.55?sorted[1][0]:null;
  var tcArr=Object.keys(cv).map(function(k){return[k,cv[k]];}).sort(function(a,b){return b[1]-a[1];});
  var constKey=tcArr.length?tcArr[0][0]:"hero";
  return{primaryKey:priKey,secondaryKey:secKey,constKey:constKey,primary:CHARS[priKey],secondary:secKey?CHARS[secKey]:null,constellation:CONST[constKey],
    meters:meters,avgPain:pn>0?pain/pn:0,disp:disp,urgency:fd[9]?fd[9].filter:"",profession:fd[4]?fd[4].filter:""};
}

function pushGHL(ud,res){
  try{

      name:ud.name,email:ud.email,phone:(ud.phoneCode||"")+(ud.phone||""),
      filtro_inversion:ud.filterTag||"",destino:ud.dest||"",

}

  +'<div id="meters" class="rv">'+meters+'</div></div></div>'
  /* de dónde viene */
  +'<div class="light" style="padding:80px 0"><div class="wrap">'
  +'<p class="kicker rv" style="margin-bottom:14px">De dónde viene</p>'
  +'<p class="body rv" style="font-size:21px">'+esc(p.painHook)+'</p>'
  +'</div></div>'
  /* banda foto + costo */
  +band(res.primaryKey,"58vh",'<div class="wrap" style="padding:64px 0">'
    +'<p class="kicker rv" style="color:var(--oroClaro);margin-bottom:14px">Lo que te está costando hoy</p>'
    +'<p class="quote rv" style="color:#fff">'+esc(p.costBlood)+'</p></div>',"center 32%")

  +'<div class="light" style="padding:74px 0"><div class="wrap">'
  +'<p class="kicker rv" style="margin-bottom:26px">Tu diagnóstico, por dentro</p>'
  +'<div class="rv">'

  +acc("Los tres momentos donde decide por ti",'<p class="body" style="font-style:italic">'+esc(p.teaser3)+'</p>',false)
  +acc("Cómo se manifiesta en tu día a día",'<p class="body">'+esc(p.manifestations)+'</p>',false)

    +'<p class="body rv" style="color:rgba(250,244,232,.9);margin-bottom:18px">En unos minutos vas a cerrar esta página y la vida va a seguir con el trabajo, los pendientes y la cena, y tu personaje va a hacer lo único que sabe hacer para sobrevivir: convencerte de que esto fue interesante y que ya luego lo ves. Así enterró cada intento tuyo de cambiar, y así piensa enterrar este, porque la claridad que sientes ahora mismo tiene fecha de vencimiento y en unos días se evapora.</p>'

      +'<p class="body rv" style="color:rgba(250,244,232,.9);margin-bottom:32px">Te lo digo de frente y sin letra pequeña: si decides avanzar, el proceso requiere inversión de tiempo y de dinero, <strong style="color:#fff;font-weight:500">no es gratis.</strong> Lo gratis ya lo tienes, es este diagnóstico. Lo que sigue es la salida.</p>'

function onScrollStick(){
  var h=function(){
    var y=window.scrollY||document.documentElement.scrollTop;
    if(y>window.innerHeight*1.4)stick.classList.add("on");else stick.classList.remove("on");
  };
  window.removeEventListener("scroll",window.__sh||function(){});
  window.__sh=h;window.addEventListener("scroll",h,{passive:true});h();
}

/* ================= HANDLERS ================= */
var FSEL=null;
window.II={
  start:function(){track("ViewContent");S.qIdx=0;S.answers=[];rQuiz();},
  card:function(el){el.classList.toggle("open");var t=el.querySelector(".ptip");if(t)t.textContent=el.classList.contains("open")?"Toca para cerrar":"Toca para ver";},
  acc:function(btn){btn.parentNode.classList.toggle("on");},
  pick:function(oi,btn){
    btn.className="opt sel";
    setTimeout(function(){
      S.answers[S.qIdx]={qid:QS[S.qIdx].id,oi:oi};
      if(S.qIdx<QS.length-1){S.qIdx++;rQuiz();}else{FSEL=null;rForm();}
    },260);
  },
  back:function(){if(S.qIdx>0){S.qIdx--;S.answers.length=S.qIdx;rQuiz();}},
  pickFilter:function(i){FSEL=i;FILTER_Q.opts.forEach(function(_,j){var el=document.getElementById("fq-"+j);if(el)el.className="optf"+(j===i?" sel":"");});},
  submitForm:function(){
    var g=function(id){var el=document.getElementById(id);return el?el.value.trim():"";};
    var ud={name:g("f-name"),email:g("f-email"),phoneCode:g("f-code"),phone:g("f-phone")};
    if(!ud.name||!ud.email||ud.email.indexOf("@")<0||!ud.phoneCode||!ud.phone||FSEL===null){document.getElementById("f-err").style.display="block";return;}
    var fo=FILTER_Q.opts[FSEL];ud.filterTag=fo.tag;ud.dest=fo.dest;
    S.ud=ud;track("Lead");rLoading();
    var res=scoreAll(S.answers);S.result=res;pushGHL(ud,res);
    try{localStorage.setItem(LS_KEY,JSON.stringify({ud:ud,result:res}));}catch(e){}
    setTimeout(function(){rResult();},2700);
  },
  wa:function(){track("Contact");},
  shared:function(){track("Share");}
};

/* ================= ARRANQUE ================= */
(function init(){
  try{
    var q=new URLSearchParams(window.location.search),sc=q.get("screen");
    if(sc==="resultado"||sc==="thankyou"){
      var s=null;try{s=localStorage.getItem(LS_KEY);}catch(e){}
      if(s){var d=JSON.parse(s);S.ud=d.ud;S.result=d.result;}
      else if(q.get("p")&&CHARS[q.get("p")]){
        var pk=q.get("p"),sk=q.get("s"),ck=q.get("c")||"hero";
        S.result={primaryKey:pk,secondaryKey:sk||null,constKey:ck,primary:CHARS[pk],secondary:(sk&&CHARS[sk])?CHARS[sk]:null,constellation:CONST[ck]||CONST.hero,
          meters:[{key:pk,name:CHARS[pk].name,pct:100}].concat(sk&&CHARS[sk]?[{key:sk,name:CHARS[sk].name,pct:68}]:[])};
        S.ud={name:q.get("n")||"Bienvenida",email:"",dest:q.get("d")||"whatsapp"};
      }
      if(S.result&&S.result.primary){rResult();return;}
    }
  }catch(e){}
  rHero();
})();

})();
