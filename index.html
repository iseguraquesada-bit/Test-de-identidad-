  +acc("Los tres momentos donde decide por ti",'<p class="body" style="font-style:italic">'+esc(p.teaser3)+'</p>',true)
  +acc("Lo que hace en tu día a día",'<p class="body">'+esc(p.manifestations)+'</p>',false)
  +acc("Las frases que dice por tu boca",chips(p.phrases),false)
  +acc("Por qué la terapia, los libros y los retiros no la tocaron",'<p class="body">'+THERAPY+'</p>',false)
  +(sec?acc("Tu personaje secundario: "+sec.name,((sec.whoIs||[]).slice(0,2)).map(function(t){return '<p class="body" style="margin-bottom:16px">'+esc(t)+'</p>';}).join(""),false):"")
  +((c||p.rolLine)?acc(p.adultez?"El rol de fondo, y por qué esta fue la única salida que encontraste":"El rol que aprendiste antes de poder elegir",
      (p.rolLine?'<p class="body" style="margin-bottom:18px">'+esc(p.rolLine)+'</p>':"")
      +(c?'<p class="body" style="margin-bottom:8px"><strong style="color:var(--tinta)">'+esc(c.name)+'.</strong></p><p class="body" style="margin-bottom:16px">'+esc(c.desc)+'</p><p class="body">'+esc(c.press)+'</p>':""),false):"")
  +'<p class="body rv" style="margin-top:30px;font-size:21px;color:var(--tinta)">Y si mientras leías esto pensaste que exagero o que no es tan así, fíjate quién está buscando el argumento.</p>'
  +'</div></div></div>'
  /* 7. LOS CUATRO CUADRANTES */
  +band(res.primaryKey,"auto",'<div class="wrap" style="padding:70px 26px">'
    +'<p class="kicker rv" style="color:var(--oroClaro);margin-bottom:14px">Cuarta parte</p>'
    +'<h2 class="h2 rv" style="color:#fff">Lo que te dio, lo que te cobra y lo que hay del otro lado</h2></div>')
  +'<div class="light" style="padding:64px 0"><div class="wrapW" style="max-width:1180px;margin:0 auto">'
  +'<div class="quad rv">'
  +QB("I","Lo que sí te dio","Te dio",p.gaveLine||"",gaveB,"")
  +QB("II","Lo que te está quitando","Te quita",p.takesLine||"",takesB,takesNote)
  +QB("III","Si nada se interrumpe","Te va a seguir cobrando",p.keepsLine||"",keepsB,"")
  +'</div>'
  +(withoutB?'<div class="qhero rv">'
    +'<p class="qk">Y del otro lado</p>'
    +'<p class="qh">Quién eres cuando la sueltas</p>'
    +(p.withoutLine?'<p class="qline">'+esc(p.withoutLine)+'</p>':"")
    +LI(withoutB)+'</div>':"")
  +'</div></div>'
  /* 8. LA CONVERSACIÓN HONESTA: desarma al personaje y abre el umbral para ella */
  +hero("puerta","auto",
    '<div class="wrap" style="padding:96px 26px">'
    +'<p class="kicker rv" style="color:var(--oroClaro);margin-bottom:18px">Sin rodeos</p>'
    +'<h2 class="h2 rv" style="color:#fff;margin-bottom:34px">Lo que te diría si estuviéramos sentadas las dos</h2>'
    +PP(rev,"lead","color:rgba(250,244,232,.96);font-size:23px;margin-bottom:22px")
    +'</div>')
  /* 9. EL PRIMER PASO, GRATIS Y HOY */
  +(step?'<div class="light" style="padding:82px 0"><div class="wrap">'
    +'<p class="kicker rv" style="margin-bottom:14px">Tu herramienta más poderosa, y no cuesta nada</p>'
    +'<h2 class="h2 rv" style="margin-bottom:26px">'+esc(step.title)+'</h2>'
    +'<div class="rv card" style="border:1px solid var(--oro);background:linear-gradient(180deg,#FFFDF8,rgba(194,155,64,.07))">'
    +PP(step.body,"body","font-size:21px;color:var(--tinta);margin-bottom:16px")
    +'</div></div></div>':"")
  /* 10. LA INVITACIÓN */
  +band("origen","auto",
    '<div class="wrap" style="padding:86px 26px">'
    +'<p class="body rv" style="color:rgba(250,244,232,.9);margin-bottom:18px">En unos minutos vas a cerrar esta página y la vida va a seguir con el trabajo, los pendientes y la cena, y ella va a hacer lo único que sabe hacer para sobrevivir: convencerte de que esto fue interesante y que ya luego lo ves. Así enterró cada intento tuyo de cambiar, y así piensa enterrar este.</p>'
    +'<p class="body rv" style="color:rgba(250,244,232,.9);margin-bottom:26px">La diferencia entre la mujer que dentro de un año sigue igual y la que por fin vive su propia vida no está en el diagnóstico, está en si algo se interrumpe o no. Y este patrón no se disuelve con el tiempo, se consolida, porque cada año que lo repites se siente menos como un personaje y más como tú.</p>'
    +(dest==="whatsapp"
      ?'<div class="rv card" style="background:rgba(250,244,232,.06);border:1px solid var(--oro);margin-bottom:20px">'
       +'<p class="kicker" style="color:var(--oroClaro);margin-bottom:12px">La salida directa</p>'
       +'<p class="body" style="color:rgba(250,244,232,.94);margin-bottom:14px">Una conversación conmigo por WhatsApp, yo, no un bot ni un formulario. Me cuentas tu resultado, te digo exactamente por dónde se sale de este personaje y, si tiene sentido avanzar, te muestro cómo lo hacemos juntas.</p>'
       +'<p class="body" style="color:rgba(250,244,232,.94);margin-bottom:20px">Te lo digo de frente y sin letra pequeña: si decides avanzar, el proceso requiere inversión de tiempo y de dinero, <strong style="color:#fff;font-weight:500">no es gratis.</strong> Lo gratis ya lo tienes, es este diagnóstico. Lo que sigue es la salida.</p>'
       +'<a class="btn" style="max-width:none" href="'+waUrl+'" target="_blank" rel="noreferrer" onclick="II.wa()">Quiero cruzar el umbral ahora</a></div>'
       +'<div class="rv"><p class="body" style="color:rgba(250,244,232,.72);margin-bottom:14px">Y si hoy no es el momento de hablar conmigo, hay una segunda puerta: la Sesión de Diagnóstico y Claridad, donde trabajamos tu caso completo con un mapa concreto de salida.</p>'
       +'<a class="btn btn-line" style="max-width:380px" href="'+CONFIG.claridad_url+'" target="_blank" rel="noreferrer">Ver la sesión de claridad</a></div>'
      :'<div class="rv card" style="background:rgba(250,244,232,.06);border:1px solid var(--oro);margin-bottom:20px">'
       +'<p class="kicker" style="color:var(--oroClaro);margin-bottom:12px">El primer paso</p>'
       +'<p class="body" style="color:rgba(250,244,232,.94);margin-bottom:14px">La Sesión de Diagnóstico y Claridad está diseñada exactamente para el momento en el que estás: ahí te doy la claridad completa de tu caso, no teoría, tu caso, y el mapa concreto para empezar a salir de este personaje.</p>'
       +'<p class="body" style="color:rgba(250,244,232,.94);margin-bottom:20px">Este personaje no se va solo y cada mes que pasa se instala más profundo. No tienes que resolverlo todo hoy, pero sí puedes elegir dar el primer paso de esta historia, que esta vez la escribes tú.</p>'
       +'<a class="btn" style="max-width:none" href="'+CONFIG.claridad_url+'" target="_blank" rel="noreferrer">Quiero mi sesión de claridad</a></div>'
       +'<div class="rv"><p class="body" style="color:rgba(250,244,232,.72);margin-bottom:14px">Y si prefieres hablarlo antes conmigo, escríbeme directo por WhatsApp y me cuentas tu resultado.</p>'
       +'<a class="btn btn-line" style="max-width:380px" href="'+waUrl+'" target="_blank" rel="noreferrer" onclick="II.wa()">Escribirle a Ileana</a></div>')
    +'<div class="rv" style="margin-top:34px;padding-top:26px;border-top:1px solid rgba(250,244,232,.16)">'
    +'<a class="btn btn-line" style="max-width:340px" href="'+shareUrl+'" target="_blank" rel="noreferrer" onclick="II.shared()">Mandarle esto a una amiga por WhatsApp</a>'
    +'<p style="margin-top:12px;font-size:19px;color:rgba(250,244,232,.75)">Se abre WhatsApp con el mensaje y el enlace ya listos.</p></div>'
    +'</div>')
  /* 11. NOTA DE CUIDADO */
  +'<div class="light" style="padding:64px 0"><div class="wrap">'
  +'<div class="rv" style="max-width:660px;margin:0 auto;text-align:center">'
  +'<div class="rule" style="margin:0 auto 24px"></div>'
  +'<p class="body" style="color:var(--texto);margin-bottom:14px">Este diagnóstico es real y lo escribí con el mismo rigor con el que trabajo cada caso. Y como la que vive tu vida eres tú, quédate con todo lo que te calzó y deja pasar lo que no.</p>'
  +'<p class="body" style="color:var(--texto)">Si algo de esto te movió más de lo que esperabas, no lo cargues sola. Cuando quieras compañía para mirarlo, aquí estoy.</p>'
  +'</div></div></div>'
  +foot()+'</div>';
  render(html,true);

  /* medidores animados + barra fija */
  setTimeout(function(){[].forEach.call(document.querySelectorAll("#meters .mbar i"),function(el,i){setTimeout(function(){el.style.width=el.getAttribute("data-w")+"%";},i*160);});},700);
  document.getElementById("stick-t").textContent=dest==="whatsapp"?"Tu personaje ya sabe que lo descubriste. No le des tiempo de acomodarse.":"El primer paso existe y está diseñado para tu momento.";
  var a=document.getElementById("stick-a");
  a.textContent=dest==="whatsapp"?"Hablar con Ileana":"Quiero claridad";
  a.href=ctaUrl;a.target="_blank";a.rel="noreferrer";

  onScrollStick();

function onScrollStick(){
  var h=function(){
    var y=window.scrollY||document.documentElement.scrollTop;
    if(y>window.innerHeight*1.4)stick.classList.add("on");else stick.classList.remove("on");
  };
  window.removeEventListener("scroll",window.__sh||function(){});
  window.__sh=h;window.addEventListener("scroll",h,{passive:true});h();
}

/* ================= HANDLERS ================= */
window.II={
  start:function(){track("ViewContent");S.qIdx=0;S.answers=[];rQuiz();},
  card:function(el){el.classList.toggle("open");var t=el.querySelector(".ptip");if(t)t.textContent=el.classList.contains("open")?"Toca para cerrar":"Toca para ver";},
  acc:function(btn){btn.parentNode.classList.toggle("on");},
  rate:function(i,v){
    var a=S.answers[S.qIdx];
    if(!a||a.qid!==QS[S.qIdx].id){a={qid:QS[S.qIdx].id,vals:[]};S.answers[S.qIdx]=a;}
    a.vals[i]=v;
    var cont=document.getElementById("ri-"+i);
    if(cont){[].forEach.call(cont.querySelectorAll(".rb"),function(b){
      b.className="rb"+(parseInt(b.getAttribute("data-v"),10)===v?" on":"");});}
    var total=QS[S.qIdx].items.length,listos=0;
    for(var k=0;k<total;k++)if(a.vals[k]!==undefined&&a.vals[k]!==null)listos++;
    if(listos===total){
      setTimeout(function(){
        if(S.qIdx<QS.length-1){S.qIdx++;rQuiz();}else{rForm();}
      },340);
    }
  },
  pick:function(oi,btn){
    btn.className="opt sel";
    setTimeout(function(){
      S.answers[S.qIdx]={qid:QS[S.qIdx].id,oi:oi};
      if(S.qIdx<QS.length-1){S.qIdx++;rQuiz();return;}
      /* Al terminar, si hay empate arriba se lo preguntamos a ella. */
      var prov=scoreAll(S.answers);
      if(prov.empate){rDesempate(prov.empate);}else{rForm();}
    },260);
  },
  desempate:function(k){S.pref=k;rForm();},
  back:function(){if(S.qIdx>0){S.qIdx--;S.answers.length=S.qIdx;rQuiz();}},
  costPick:function(el){el.classList.toggle("on");II.costCount();},
  costCount:function(){
    var box=document.getElementById("costbox");if(!box)return;
    var tot=box.querySelectorAll(".costi").length,n=box.querySelectorAll(".costi.on").length;
    var out=document.getElementById("costout");if(!out)return;
    var msg;
    if(n===0)msg="Todavía no has marcado nada, y si de verdad no reconoces ninguna, esa es la mejor noticia que vas a leer hoy: este personaje todavía no te está cobrando fuerte y estás a tiempo de que no lo haga.";
    else if(n<=2)msg="Marcaste "+n+" de "+tot+", y ahí es exactamente donde empieza. Ningún personaje cobra de golpe, cobra en cuotas pequeñas que se sienten normales, y por eso pasan años antes de que una mujer se dé cuenta de lo que ya pagó.";
    else if(n<=4)msg="Marcaste "+n+" de "+tot+". Eso ya no es una racha ni una temporada difícil, es un patrón funcionando, y lo que estás sintiendo tiene una causa concreta que se puede nombrar y desmontar.";
    else msg="Marcaste "+n+" de "+tot+", y necesito que leas esto despacio: lo que llevas cargando no es tu personalidad ni tu carácter, es un personaje cobrando muy caro y hace mucho tiempo. Esto no se resuelve con más esfuerzo, porque el esfuerzo es justamente lo que lo mantiene vivo.";
    out.innerHTML='<p class="body" style="color:var(--tinta);font-size:21px">'+msg+'</p>';
    out.style.display="block";
  },
  submitForm:function(){
    var g=function(id){var el=document.getElementById(id);return el?el.value.trim():"";};
    var ud={name:g("f-name"),email:g("f-email"),phoneCode:g("f-code"),phone:g("f-phone")};
    if(!ud.name||!ud.email||ud.email.indexOf("@")<0||!ud.phoneCode||!ud.phone){document.getElementById("f-err").style.display="block";return;}
    S.ud=ud;track("Lead");rLoading();
    var res=scoreAll(S.answers,S.pref);S.result=res;ud.dest=res.dest;pushGHL(ud,res);
    try{localStorage.setItem(LS_KEY,JSON.stringify({ud:ud,result:res}));}catch(e){}
    setTimeout(function(){rResult();},2700);
  },
  wa:function(){track("Contact");},
  shared:function(){track("Share");}
};

/* ================= ARRANQUE ================= */
(function init(){
  try{
    var q=new URLSearchParams(window.location.search),sc=q.get("screen");
    if(sc==="resultado"||sc==="thankyou"){
      var s=null;try{s=localStorage.getItem(LS_KEY);}catch(e){}
      if(s){var d=JSON.parse(s);S.ud=d.ud;S.result=d.result;
        /* El resultado guardado trae una copia del personaje del día que hizo el test.
           Lo volvemos a armar desde el archivo actual para que siempre lea la versión vigente. */
        if(S.result&&S.result.primaryKey&&CHARS[S.result.primaryKey]){
          S.result.primary=CHARS[S.result.primaryKey];
          S.result.secondary=(S.result.secondaryKey&&CHARS[S.result.secondaryKey])?CHARS[S.result.secondaryKey]:null;
          S.result.constellation=CONST[S.result.constKey]||CONST.hero;
        }else{S.result=null;}
      }
      else if(q.get("p")&&CHARS[q.get("p")]){
        var pk=q.get("p"),sk=q.get("s"),ck=q.get("c")||"hero";
        S.result={primaryKey:pk,secondaryKey:sk||null,constKey:ck,primary:CHARS[pk],secondary:(sk&&CHARS[sk])?CHARS[sk]:null,constellation:CONST[ck]||CONST.hero,
          meters:[{key:pk,name:CHARS[pk].name,pct:100}].concat(sk&&CHARS[sk]?[{key:sk,name:CHARS[sk].name,pct:68}]:[])};
        S.ud={name:q.get("n")||"Bienvenida",email:"",dest:q.get("d")||"whatsapp"};
      }
      if(S.result&&S.result.primary){rResult();return;}
    }
  }catch(e){}
  rHero();
})();

})();
</script>
