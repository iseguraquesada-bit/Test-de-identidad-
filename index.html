<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap');
:root{
  --crema:#FAF4E8;--crema2:#F2E7D2;--blanco:#FFFDF8;--tinta:#12283F;--tinta2:#1C3A5E;--azul:#2F6DA8;
  --celeste:#8FC2DE;--celesteSuave:#DDEBF3;--oro:#C29B40;--oroClaro:#E8DCB6;--texto:#43536B;--muted:#6B7789;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{font-family:'Jost',sans-serif;background:var(--crema);color:var(--tinta);font-size:21px;line-height:1.78;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{display:block;max-width:100%;}
.serif{font-family:'Cormorant Garamond',serif;}
.wrap{max-width:680px;margin:0 auto;padding:0 26px;}
.wrap,.wrapW{padding-left:26px!important;padding-right:26px!important;}
.wrapW{max-width:1120px;margin:0 auto;padding:0 26px;}

/* ---------- animaciones ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.3,1),transform .7s cubic-bezier(.2,.7,.3,1);}
.rv.on{opacity:1;transform:none;}
.screen{min-height:100vh;animation:fadeIn .45s ease;}

/* ---------- botones ---------- */
.btn{display:inline-block;width:100%;max-width:460px;padding:23px 28px;background:linear-gradient(135deg,#D4AB4C,#B08830);border:none;border-radius:4px;color:#fff;font-family:'Jost',sans-serif;font-size:21px;font-weight:500;letter-spacing:.4px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:0 14px 34px rgba(150,115,35,.32);transition:transform .18s,box-shadow .25s,filter .2s;}
.btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 20px 42px rgba(150,115,35,.42);filter:brightness(1.06);}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
.btn-line{background:none;border:1px solid rgba(250,244,232,.5);color:var(--crema);box-shadow:none;font-size:19px;padding:17px 24px;}
.btn-line:hover{background:rgba(250,244,232,.1);transform:none;box-shadow:none;}
.linkback{background:none;border:none;color:var(--muted);font-family:'Jost',sans-serif;font-size:19px;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:4px;}

/* ---------- tipografía ---------- */
.kicker{font-size:18px;font-weight:500;letter-spacing:4.2px;text-transform:uppercase;color:var(--oro);}
.h1{font-family:'Cormorant Garamond',serif;font-size:clamp(46px,9vw,80px);font-weight:600;line-height:1.03;letter-spacing:-.5px;}
.h2{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,6.2vw,50px);font-weight:600;line-height:1.14;}
.h3{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,5vw,38px);font-weight:600;line-height:1.24;}
.lead{font-size:24px;line-height:1.8;}
.body{font-size:22px;line-height:1.85;color:var(--texto);}
.sl{font-size:17px;font-weight:600;letter-spacing:3.4px;text-transform:uppercase;color:var(--oro);}
.quote{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,5.8vw,44px);font-style:italic;font-weight:500;line-height:1.34;}
.rule{width:54px;height:2px;background:var(--oro);}

/* ---------- bloques ---------- */
.dark{background:var(--tinta);color:var(--crema);}
.dark .body,.dark .lead{color:rgba(250,244,232,.86);}
.dark .sl{color:var(--oroClaro);}
.light{background:var(--crema);}
.blue{background:var(--celesteSuave);}
.card{background:var(--blanco);border:1px solid var(--crema2);border-radius:5px;padding:32px 30px;box-shadow:0 3px 22px rgba(18,40,63,.05);}
.hero-scrim{position:absolute;inset:0;background:linear-gradient(103deg,rgba(10,20,32,.9) 0%,rgba(10,20,32,.66) 48%,rgba(10,20,32,.3) 100%);}
@media(max-width:640px){.wrap,.wrapW{padding-left:22px!important;padding-right:22px!important;}
.h1{font-size:clamp(40px,10vw,56px)}
.quote{font-size:clamp(27px,7vw,34px)}}
@media(max-width:760px){.hero-scrim{background:linear-gradient(180deg,rgba(10,20,32,.62) 0%,rgba(10,20,32,.84) 42%,rgba(10,20,32,.94) 100%);}}
.photo{width:100%;height:100%;object-fit:cover;}
.figcap{font-size:17px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);}

/* ---------- test ---------- */
.pbar{height:3px;background:rgba(18,40,63,.12);border-radius:2px;overflow:hidden;}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--oro),#D9B85F);transition:width .5s cubic-bezier(.3,.8,.3,1);}
.opt{width:100%;text-align:left;padding:23px 26px;background:var(--blanco);border:1px solid var(--crema2);border-radius:4px;color:var(--texto);font-family:'Jost',sans-serif;font-size:21px;line-height:1.6;cursor:pointer;transition:border-color .2s,background .2s,transform .18s,box-shadow .25s;animation:slideIn .42s cubic-bezier(.2,.7,.3,1) both;}
.opt:hover{border-color:var(--oro);background:#fff;transform:translateX(4px);box-shadow:0 8px 26px rgba(18,40,63,.07);}
.opt.sel{background:rgba(194,155,64,.13);border-color:var(--oro);color:var(--tinta);}

/* ---------- formulario ---------- */
.inp{width:100%;padding:18px 18px;background:var(--blanco);border:1px solid var(--crema2);border-radius:4px;color:var(--tinta);font-family:'Jost',sans-serif;font-size:20px;outline:none;transition:border-color .2s,box-shadow .2s;}
.inp:focus{border-color:var(--oro);box-shadow:0 0 0 3px rgba(194,155,64,.16);}
.lbl{display:block;font-size:16px;font-weight:500;letter-spacing:2.6px;text-transform:uppercase;color:var(--azul);margin-bottom:9px;}
.optf{width:100%;text-align:left;padding:18px 20px;background:var(--blanco);border:1px solid var(--crema2);border-radius:4px;color:var(--texto);font-family:'Jost',sans-serif;font-size:19px;line-height:1.55;cursor:pointer;transition:all .2s;}
.optf:hover{border-color:var(--oro);}
.optf.sel{background:rgba(194,155,64,.13);border-color:var(--oro);color:var(--tinta);}
/* --- escala de tres niveles del diagnóstico --- */
.ritem{background:var(--blanco);border:1px solid var(--crema2);border-radius:5px;padding:22px 22px 18px;margin-bottom:14px;}
.rtxt{font-family:'Jost',sans-serif;font-size:21px;line-height:1.5;color:var(--texto);margin-bottom:16px;}
.rbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
.rb{padding:15px 8px;background:#FFFDF8;border:1px solid var(--crema2);border-radius:4px;color:var(--muted);font-family:'Jost',sans-serif;font-size:17px;line-height:1.25;cursor:pointer;transition:all .18s;}
.rb:hover{border-color:var(--oro);color:var(--tinta);}
.rb.on{background:var(--oro);border-color:var(--oro);color:#fff;font-weight:500;}
@media(max-width:640px){.rtxt{font-size:22px}.rb{font-size:16px;padding:14px 5px}.ritem{padding:20px 18px 16px}}
/* --- autodiagnóstico del costo: ella marca lo que sí le pasa --- */
.costi{display:flex;align-items:flex-start;gap:16px;width:100%;text-align:left;padding:20px 22px;background:var(--blanco);border:1px solid var(--crema2);border-radius:4px;color:var(--texto);font-family:'Jost',sans-serif;font-size:21px;line-height:1.55;cursor:pointer;transition:all .2s;margin-bottom:12px;}
.costi:hover{border-color:var(--oro);}
.costi .bx{flex:0 0 26px;width:26px;height:26px;margin-top:3px;border:1.5px solid var(--crema2);border-radius:3px;position:relative;transition:all .2s;}
.costi.on{background:rgba(194,155,64,.13);border-color:var(--oro);color:var(--tinta);}
.costi.on .bx{background:var(--oro);border-color:var(--oro);}
.costi.on .bx:after{content:"";position:absolute;left:8px;top:3px;width:8px;height:14px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(40deg);}

/* ---------- medidores del perfil ---------- */
.meter{margin-bottom:20px;}
.meter .mtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.meter .mnm{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;}
.meter .mpc{font-size:19px;letter-spacing:2px;color:var(--oroClaro);}
.meter .mbar{height:7px;background:rgba(250,244,232,.14);border-radius:4px;overflow:hidden;}
.meter .mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--oro),#E6C874);border-radius:4px;transition:width 1.5s cubic-bezier(.2,.8,.2,1);}

/* ---------- acordeón ---------- */
.acc{border-top:1px solid var(--crema2);}
.acc:last-of-type{border-bottom:1px solid var(--crema2);}
.acc>button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:18px;background:none;border:none;padding:28px 2px;cursor:pointer;text-align:left;font-family:'Cormorant Garamond',serif;font-size:clamp(26px,4.8vw,34px);font-weight:600;color:var(--tinta);line-height:1.26;}
.acc>button span.ic{flex-shrink:0;width:34px;height:34px;border:1px solid var(--oro);border-radius:50%;position:relative;transition:transform .35s,background .3s;}
.acc>button span.ic::before,.acc>button span.ic::after{content:"";position:absolute;background:var(--oro);left:50%;top:50%;transform:translate(-50%,-50%);}
.acc>button span.ic::before{width:13px;height:1.5px;}
.acc>button span.ic::after{width:1.5px;height:13px;transition:opacity .3s;}
.acc.on>button span.ic{background:rgba(194,155,64,.14);transform:rotate(180deg);}
.acc.on>button span.ic::after{opacity:0;}
.acc .accb{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.3,.8,.3,1);}
.acc.on .accb{max-height:1800px;}
.acc .accb-in{padding:0 2px 30px;}

/* ---------- barra fija ---------- */
.stick{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#0C1D2E;box-shadow:0 -14px 30px rgba(12,29,46,.28);border-top:1px solid rgba(194,155,64,.45);padding:16px 18px;transform:translateY(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1);}
.stick.on{transform:none;}
.stick .sin{max-width:800px;margin:0 auto;display:flex;align-items:center;gap:18px;}
.stick p{flex:1;font-size:20px;line-height:1.45;color:rgba(250,244,232,.95);}
.stick a{flex-shrink:0;max-width:290px;padding:17px 22px;font-size:19px;margin:0;}
@media(max-width:640px){.stick p{display:none}.stick a{max-width:none}}

/* ---------- pie ---------- */
.foot{text-align:center;padding:34px 20px;font-size:16px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;}
/* --- barra comparativa: cuánto respondió el personaje y cuánto respondió ella --- */

.split i{display:block;height:100%;}
.split .sper{background:linear-gradient(90deg,#C29B40,#E8DCB6);}
.split .slib{background:rgba(143,194,222,.55);}
.splab{display:flex;justify-content:space-between;gap:16px;margin-top:12px;font-size:19px;color:rgba(250,244,232,.86);}
.splab b{font-weight:500;color:#fff;font-size:22px;}
@media(max-width:640px){.splab{font-size:18px}.splab b{font-size:21px}}
/* --- el balance: tres columnas editoriales y un bloque final destacado --- */
.quad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid var(--crema2);}
.quad>.qbox{border-left:1px solid var(--crema2);}
.quad>.qbox:first-child{border-left:none;}
@media(max-width:1060px){.quad{grid-template-columns:1fr;}
 .quad>.qbox{border-left:none;border-top:1px solid var(--crema2);}
 .quad>.qbox:first-child{border-top:none;}}
.qbox{padding:38px 32px 36px;}
.qnum{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--oro);line-height:1;margin-bottom:14px;}
.qk{font-size:16px;letter-spacing:3px;text-transform:uppercase;color:var(--azul);margin-bottom:10px;font-weight:500;}
.qh{font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1.18;color:var(--tinta);margin-bottom:14px;}
.qline{font-family:'Cormorant Garamond',serif;font-size:26px;font-style:italic;line-height:1.42;color:var(--tinta2);margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid var(--crema2);}
.qn{font-size:20px;line-height:1.65;color:var(--texto);margin-bottom:20px;}
.ql{list-style:none;margin:0;padding:0;}
.ql li{position:relative;padding-left:22px;margin-bottom:16px;font-size:21px;line-height:1.55;color:var(--texto);}
.ql li:last-child{margin-bottom:0;}
.ql li:before{content:"";position:absolute;left:0;top:12px;width:11px;height:1px;background:var(--oro);}
/* el bloque aspiracional, el que sostiene todo */

.qhero .ql li{font-size:22px;}
.qhero .qh{font-size:40px;margin-bottom:20px;}
.qhero .ql{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;}
@media(max-width:820px){.qhero{padding:38px 26px}.qhero .ql{grid-template-columns:1fr}.qhero .qh{font-size:32px}.qhero .qline{font-size:26px}}
@media(max-width:640px){.qh{font-size:30px}.qline{font-size:24px}.ql li{font-size:22px}.qbox{padding:32px 22px}}
.dwn{width:1px;height:54px;margin:0 auto;background:linear-gradient(180deg,rgba(232,220,182,0),var(--oro));}
.chip{background:var(--blanco);border-left:3px solid var(--oro);border-radius:3px;padding:20px 24px;margin-bottom:13px;}
</style>

    gaveB:["La capacidad de sostener lo que otros habrían soltado","Resolver bajo presión sin que se te note el miedo","Ver el problema antes de que se vuelva problema","Que la gente confíe en tu palabra","Buena parte de lo que hoy tienes construido"],
    takesNote:"Así se siente por dentro cuando ella manda. Puede que reconozcas una, puede que reconozcas todas.",
    takesB:["Un cansancio que el descanso ya no arregla","Sostener a todos y sentir que a ti no te sostiene nadie","Una alerta encendida incluso en los días tranquilos","No poder estar en paz sin sentir que se te olvida algo","Una desconfianza que nunca quisiste tener","La soledad de estar rodeada de gente que depende de ti","No tener claro qué quieres, porque siempre estás en lo que hace falta"],
    withoutB:["Duermes distinto, porque tu cabeza deja de trabajar de noche","Delegas sin quedarte revisando","Escuchas un plan que no es el tuyo sin sentirte en peligro","Recibes sin tener que devolver de inmediato","Te conocen, no solo te necesitan","Recuperas el gozo, que es disfrutar sin medir lo que falta","Sigues siendo la que resuelve, pero ahora eliges cuándo"],
    keepsB:["Te cobra en cuotas tan pequeñas que se sienten normales","Nunca te presenta la cuenta completa","Las conversaciones que no tuviste por estar resolviendo","Los planes que quedaron para cuando haya tiempo","Y la mujer que ibas a ser, en pausa"],
    gaveLine:"No fue un error tenerla. Fue lo único que funcionó.",
    takesLine:"Y te lo cobra en silencio, en la parte de tu vida donde nadie aplaude.",
    keepsLine:"No va a pasar una tragedia. Va a pasar otro año igual.",
    withoutLine:"Imagínate un martes cualquiera en el que nada dependa de que tú estés vigilando. Eso no es una fantasía, es lo que hay del otro lado.",
    rev:["Nada de lo que acabas de leer define quién eres hoy. Es el mapa de tu pasado, y el resto de tu historia arranca justo aquí.","Toda la vida te dijeron que controlas porque eres fuerte, y no es cierto. Controlas porque una niña decidió que si ella no sostenía el mundo el mundo se caía, y nadie llegó nunca a decirle que ese no era su trabajo. Llevas décadas pagando una deuda que jamás fue tuya, y ese es el único motivo por el que este personaje sigue vivo.","Y hay algo que ella nunca quiso que supieras: la gente que amas no necesita que la controles, necesita que estés, presente y tranquila. El día que sueltas no pierdes a nadie, te recuperas a ti, y ese es exactamente el escenario donde ella no sobrevive.","Tú no naciste siendo ella, naciste mucho antes, y esa mujer que existía antes de que el miedo le diera un uniforme sigue ahí adentro, intacta, esperando que alguien por fin la llame por su nombre.","Este es el umbral, y de este lado está la vida que ella administra mientras del otro lado está la tuya."],
    painHook:"Porque en tu casa todo era un caos, alguien no cumplió, alguien falló o alguien se fue, y la única opción que encontraste fue hacerte cargo de todos menos de ti. Desde entonces no sabes cómo soltar sin sentir que todo se derrumba.",
    core:"Necesitas que todo esté en orden para poder respirar, así que lideras, organizas, planificas y anticipas. Desde afuera pareces admirable, pero por dentro vives agotada, cargada y profundamente sola: no porque te guste mandar, sino porque no sabes cómo dejar de hacerlo sin sentir que estás fallando.",
    shadow:"No es fuerza, es miedo disfrazado de organización.",
    gift:"Antes de cobrarte algo, este personaje te salvó. Gracias a él sostuviste una casa, un trabajo o una familia cuando nadie más lo estaba haciendo, y aprendiste a resolver cosas que a mucha gente le quedan grandes. Nada de eso es mentira y nadie te lo va a quitar. El problema no es que controles, es que ya no sabes cómo dejar de hacerlo ni cuando no hace falta.",
    notKnew:"El control no nace de desconfiar de los demás, nace de una época en la que tú fuiste la única variable predecible. Por eso soltar no se siente como descansar, se siente como riesgo: tu sistema aprendió que relajarse es justo el momento en el que las cosas se caen. No estás exagerando, estás repitiendo un aprendizaje que un día te salvó.",
    costBlood:"Este personaje no te cobra de golpe, te cobra en cuotas tan pequeñas que se sienten normales, y las cobra en silencio mientras tú sostienes la vida de todos los demás.",
    costs:["Vivo cansada de una forma que el descanso ya no arregla","No puedo soltar algo sin sentir que se va a caer","Me irrito por cosas que sé que no son tan graves","Mi cuerpo lleva tiempo avisándome y yo lo sigo posponiendo","Me cuesta confiar, incluso en la gente que amo","Siento que sostengo a todos y que a mí no me sostiene nadie","No recuerdo la última vez que estuve tranquila sin estar pendiente de algo","Cuando por fin puedo parar, no sé cómo hacerlo"],
    teaser3:"Hay tres momentos donde ella toma el volante sin pedirte permiso: cuando alguien que amas decide algo sin consultarte y ella lo lee como una traición, cuando algo se sale del plan y activa el modo emergencia aunque no lo sea, y cuando estás a punto de descansar y te susurra que todavía no te lo has ganado.",
    manifestations:"Ella no delega, porque está convencida de que nadie lo va a hacer igual. Se mete en todo, incluso en lo que no le corresponde, revisa lo que ya estaba bien y convierte cualquier imprevisto en una emergencia. Y cuando algo no sale como lo planeó no se queda callada, reorganiza el mundo entero hasta que vuelva a encajar.",
    phrases:"'Si no lo hago yo, nadie lo hará bien.' 'No puedo soltar, todo depende de mí.' 'Después descanso, ahora hay que resolver.' 'No puedo confiar del todo, ya me fallaron antes.'",
    futureBlock:"El control va a seguir cerrándote puertas, y con ellas las relaciones profundas, las decisiones valientes y los momentos de gozo real, porque nadie puede vivir libremente bajo supervisión constante, ni siquiera tú.",
    liberation:"Aquí va la verdad que nadie se ha atrevido a decirte: tú no controlas porque seas fuerte, controlas porque un día, siendo una niña, decidiste que si tú no sostenías el mundo el mundo se caía, y nadie llegó nunca a decirte que ese no era tu trabajo. Llevas décadas pagando una deuda que jamás fue tuya. Y lo más duro de ver es que las personas que amas no necesitan que las controles, necesitan que estés ahí: presente, tranquila y tuya. El día que sueltas el control no pierdes a nadie, te recuperas a ti, y eso es precisamente lo que el personaje nunca va a dejarte hacer sola, porque soltarlo significa su muerte."},
  salvadora:{name:"La Salvadora",tag:"Si soy útil, entonces valgo",
    whoIs:["Ella no es una mujer buena ni especialmente generosa, aunque eso es lo que todo el mundo ve. Es la que entendió que su lugar en el mundo hay que ganárselo, y que la forma de ganárselo es siendo necesaria.", "Vive con el radar encendido las veinticuatro horas, escaneando quién está mal, quién necesita algo y dónde hace falta. Y cada vez que alguien agradece que siempre estés, ella confirma que su método funciona y se queda otro año más.", "Y no es tu forma de amar. Es un intercambio que aprendiste tan temprano que dejaste de verlo como un intercambio."],
    birth:["Ella nace en una casa donde una niña necesitaba algo y no había quién se lo diera, o donde había alguien tan ocupado, tan enfermo o tan roto que la niña entendió sola que pedir no era una opción.", "Esa niña hizo el cálculo que podía hacer con lo que tenía: si no me van a cuidar por ser, que me quieran por servir. Y le funcionó, porque la niña que ayuda recibe algo, aunque sea atención, aunque sea alivio, aunque sea que por un rato nadie se enoje.", "Por eso hoy poner un límite no se te siente como cuidarte, se te siente como traicionar. No es culpa mal manejada, es ella recordándote la regla con la que sobrevivió: si dejo de dar, me quedo sola."],
    gaveLine:"Tu capacidad de amar nunca fue el problema.",
    takesLine:"Y te lo cobra en la única moneda que nadie te ve gastar.",
    keepsLine:"No va a pasar una tragedia. Va a pasar otro año dando desde el vacío.",
    withoutLine:"Imagínate que alguien te pregunte cómo estás de verdad y que tú tengas la respuesta lista, y ganas de darla. Eso es lo que hay del otro lado.",
    gaveB:["Una sensibilidad para leer a la gente que muy pocas personas tienen", "La capacidad de sostener a otros en sus peores momentos", "Vínculos donde la gente te confía lo que no le cuenta a nadie", "Un lugar en el mundo cuando no sabías cómo ganártelo de otra forma", "La certeza de que puedes con lo que se venga"],
    takesNote:"Nada de esto se ve por fuera, porque tú eres la que siempre está bien. Puede que reconozcas una, puede que reconozcas todas.",
    takesB:["Dar hasta quedarte sin nada y aun así sentir que debes más", "Culpa cada vez que piensas primero en ti", "No saber a quién pedirle cuando eres tú la que necesita", "Una soledad muy particular, estando rodeada de gente", "Cansancio de gente que amas, y el silencio de no poder decirlo", "Saber más de la vida de los demás que de la tuya", "No tener claro qué quieres, porque siempre estás en lo que otro necesita"],
    withoutB:["Recibes sin sentir que quedaste en deuda", "Dices que no y no se te cae el mundo encima", "Ayudas porque quieres, no porque tienes que", "Te dejas conocer, no solo necesitar", "Descubres quién se queda cuando dejas de ser útil, y eso es información valiosísima", "Tu sensibilidad sigue intacta, pero ahora también te alcanza para ti", "Sigues siendo la que sostiene, pero ya no a costa tuya"],
    keepsB:["Te sigue cobrando en energía que no vuelve", "Te acerca gente que se nutre de ti sin devolverte nada", "Aleja sin querer a quienes sí podrían darte", "Los años en los que te tocaba a ti y estabas ocupada", "Y la mujer que hay detrás de tanto dar, todavía sin conocer"],
    rev:["Nada de lo que acabas de leer define quién eres hoy. Es el mapa de tu pasado, y el resto de tu historia arranca justo aquí.", "Toda la vida creíste que eras indispensable, y nunca lo fuiste. Este personaje te hizo creer que si dejabas de dar te quedabas sola, cuando la verdad es que la gente que de verdad te ama lleva años esperando conocer a la mujer que se esconde detrás de tanto dar, y no sabe cómo llegar a ella porque tú misma pusiste el mostrador en medio.", "Y hay algo que ella nunca quiso que supieras: salvas para justificar tu lugar, como si existir así, sin más, no fuera suficiente. Y el día que dejas de salvar no te quedas sola, te quedas contigo, que es exactamente la persona que llevas toda la vida abandonando por ir a rescatar a los demás.", "Tú no naciste siendo ella, naciste mucho antes, cuando todavía pedías sin pensarlo dos veces, y esa niña sigue ahí adentro esperando que alguien la cuide a ella.", "Este es el umbral, y de este lado está la vida donde te quieren por lo que haces mientras del otro lado está la vida donde te quieren."],
    step:{"title": "Nómbrala", "body": ["Durante los próximos siete días, cada vez que sientas el impulso de resolverle algo a alguien, de ofrecerte o de dar un consejo que no te pidieron, para tres segundos y nómbrala: esta es ella, no soy yo.", "No te obligues a cambiar nada, no te regañes y no te exijas hacerlo distinto todavía. Solo sepáralas.", "Eso es todo, y no es poco: es el primer movimiento de la Ingeniería de Identidad, porque un personaje solo tiene poder mientras pasa por ti sin nombre. En el momento en que lo nombras deja de ser tú y se convierte en algo que puedes observar, y todo lo que se puede observar se puede soltar."]},
    painHook:"Porque nadie te cuidó cuando lo necesitaste, y aprendiste que la única forma de que te vieran era siendo útil y dando siempre, hasta que un día te miraste y ya no quedaba nada para ti. Aun así seguiste dando, porque no sabías qué otra cosa ser.",
    core:"Vives con el radar emocional encendido las veinticuatro horas, disponible para todos menos para ti, porque aprendiste que el amor se gana y que si das lo suficiente al fin te van a ver y te van a elegir.",
    shadow:"No es generosidad, es una forma sofisticada de no sentir, y nace de la herida de no haber sido cuidada.",
    gift:"Este personaje te dio algo real: una sensibilidad para leer a la gente que muy pocas personas tienen, y un lugar en el mundo cuando no sabías cómo ganártelo de otra forma. Ser buena no es el problema y no hay que dejar de serlo. El problema es que aprendiste a dar hasta desaparecer, y hoy no sabes cómo estar en un vínculo sin desaparecer en él.",
    notKnew:"Dar te calma, y eso tiene una explicación: cada vez que resuelves algo de alguien más, tu sistema baja una ansiedad que no tiene nada que ver con esa persona. Por eso no puedes dejar de ayudar aunque estés destruida, porque ayudar dejó de ser generosidad hace mucho y se convirtió en tu forma de regularte.",
    costBlood:"El precio de este personaje se paga en una moneda que nadie ve, y es tu propia presencia, porque cada vez que te ocupas de alguien más te ausentas un poco de ti y esa ausencia se va acumulando.",
    costs:["Doy hasta quedarme sin nada y aun así siento que debo más","Me siento culpable cuando pienso primero en mí","Poner un límite me deja mal por días","Estoy rodeada de gente y me siento profundamente sola","Cuando yo necesito algo, no sé a quién pedirle","Me agota gente que quiero y no me atrevo a decirlo","Sé más de la vida de los demás que de la mía","Ayudo incluso cuando nadie me lo pidió"],
    teaser3:"Hay tres momentos donde ella toma el volante sin pedirte permiso: cuando alguien cuenta un problema y ya está armando la solución antes de que le pidan opinión, cuando eres tú la que necesita algo y decide que no es momento de molestar a nadie, y cuando por fin te sientas a descansar y te recuerda quién te está necesitando ahora mismo.",
    manifestations:"Ella se ofrece antes de que le pidan, da consejos que nadie solicitó y se queda en vínculos que la desgastan porque esa persona la necesita. Convierte cualquier conversación en un espacio para el otro, y cuando alguien pregunta cómo estás de verdad, cambia el tema con una habilidad impresionante.",
    phrases:"'No me cuesta nada, yo puedo.' 'Si no lo hago yo, ¿quién la va a ayudar?' 'Lo hago por amor.' 'Después me ocupo de lo mío.'",
    futureBlock:"Vas a seguir dando desde el vacío, atrayendo personas que se nutren de ti sin devolverte nada y alejando sin querer a las que sí podrían darte lo que necesitas.",
    liberation:"La revelación que va a dolerte y a liberarte al mismo tiempo es esta: nunca fuiste tan indispensable como creías, y las personas que de verdad te aman no te aman por lo que das, llevan años esperando conocer a la mujer que se esconde detrás de tanto dar. Salvas a otros porque fue la única forma que encontraste de justificar tu lugar en el mundo, como si existir así, sin más, no fuera suficiente. Y aquí está lo que lo cambia todo: el día que dejas de salvar no te quedas sola, te quedas contigo, y esa es exactamente la persona que llevas toda la vida abandonando por ir a rescatar a los demás."},
  invisible:{name:"La Invisible",tag:"Mejor no molesto, mejor no incomodo",
    whoIs:["Ella no es tímida ni humilde, aunque eso es lo que la gente concluye. Es la que aprendió que ser vista tiene consecuencias y decidió que era más seguro ocupar poco espacio.", "Trabaja bajando el volumen: mide cada palabra antes de decirla, calcula si vale la pena incomodar y casi siempre concluye que no. Y cada vez que una conversación pasa sin conflicto, ella confirma que su estrategia funciona y se queda otro año más.", "Y no es tu carácter. Es una decisión que tomaste hace mucho, cuando mostrarte salía caro."],
    birth:["Ella nace el día en que una niña entendió que era demasiado: demasiado intensa, demasiado sensible, demasiado preguntona, demasiado ella. Puede que alguien se lo dijera con palabras, y puede que lo aprendiera de una mirada, de un silencio o de un castigo que llegó justo cuando estaba siendo ella misma.", "Y esa niña hizo lo más inteligente que podía hacer, que fue achicarse. Bajó la voz, dejó de pedir y dejó de necesitar, y en efecto la dejaron en paz, porque a la niña que no molesta nadie la corrige.", "Por eso hoy hablar no se te siente como expresarte, se te siente como exponerte. No es falta de carácter, es ella anticipando un rechazo que ya pasó y que sigue tratando como si fuera esta tarde."],
    gaveLine:"Hacerte pequeña fue inteligente cuando era peligroso ser vista.",
    takesLine:"Y te lo cobra en todo lo que no dijiste y sigues cargando.",
    keepsLine:"No va a pasar una tragedia. Va a pasar otro año en silencio.",
    withoutLine:"Imagínate decir lo que piensas y ver que el mundo sigue ahí, intacto, y tú también. Eso es lo que hay del otro lado.",
    gaveB:["Paz en una casa donde llamar la atención salía caro", "Una capacidad de leer el ambiente que casi nadie tiene", "Que te hayas ahorrado conflictos que no valían nada", "La habilidad de escuchar de verdad, que es rarísima", "Sobrevivir en lugares donde otras no habrían aguantado"],
    takesNote:"Esto no se ve desde afuera, porque tú eres la que nunca da problemas. Puede que reconozcas una, puede que reconozcas todas.",
    takesB:["Guardarte lo que piensas y cargarlo después", "Decir que sí cuando por dentro estás diciendo que no", "Un resentimiento que no sabes dónde poner", "Miedo a ocupar espacio, incluso donde te lo ganaste", "Que la gente cercana no sepa lo que sientes", "Hacer tus sueños más pequeños antes de intentarlos", "Molestarte porque no te ven y a la vez esforzarte por no ser vista"],
    withoutB:["Dices lo que piensas y sobrevives a que a alguien no le guste", "Pides sin ensayarlo diez veces antes", "Ocupas tu lugar sin pedir permiso por estar ahí", "Te enojas y no se cae nada", "La gente te conoce de verdad, no la versión cómoda de ti", "Tu sensibilidad deja de ser escondite y pasa a ser tu don", "Sigues siendo pacífica, pero ya no a costa de desaparecer"],
    keepsB:["El resentimiento se sigue acumulando en silencio", "Las palabras que no dijiste, guardadas todas juntas", "Los lugares donde debiste estar y te quedaste afuera", "Relaciones donde te quieren sin conocerte", "Y la mujer que ibas a ser, todavía pidiendo permiso"],
    rev:["Nada de lo que acabas de leer define quién eres hoy. Es el mapa de tu pasado, y el resto de tu historia arranca justo aquí.", "Toda la vida creíste que el mundo te pedía ser menos, y nunca fue el mundo. La única persona que sigue firmando ese contrato eres tú, todos los días, por miedo a un rechazo que ocurrió hace décadas y que sigues reviviendo como si fuera esta tarde.", "Y hay algo que ella nunca quiso que supieras: aquella niña que era demasiado no tenía nada malo, le tocó gente que no supo recibirla, que es algo completamente distinto. Cada vez que te achicas le confirmas a esa niña que tenía razón en esconderse, y cada vez que ocupas tu lugar la liberas un poco más.", "Tú no naciste siendo ella, naciste mucho antes, cuando hablabas sin medir el efecto, y tu presencia nunca fue el problema: lo que te está costando la vida es tu ausencia.", "Este es el umbral, y de este lado está la vida donde caben todos menos tú mientras del otro lado está la tuya."],
    step:{"title": "Nómbrala", "body": ["Durante los próximos siete días, cada vez que sientas el impulso de callarte, de suavizar lo que ibas a decir o de achicarte para no incomodar, para tres segundos y nómbrala: esta es ella, no soy yo.", "No te obligues a cambiar nada, no te regañes y no te exijas hacerlo distinto todavía. Solo sepáralas.", "Eso es todo, y no es poco: es el primer movimiento de la Ingeniería de Identidad, porque un personaje solo tiene poder mientras pasa por ti sin nombre. En el momento en que lo nombras deja de ser tú y se convierte en algo que puedes observar, y todo lo que se puede observar se puede soltar."]},
    painHook:"Porque alguien te hizo sentir que eras demasiado, demasiado intensa, demasiado sensible, demasiado tú, y decidiste achicarte para que te quisieran bajando la voz, la mirada y tus sueños. Desde entonces nadie te busca, porque tú misma les enseñaste a no hacerlo.",
    core:"Aprendiste a hacerte pequeña para que no te rechazaran. No es que no tengas poder, es que lo escondes por miedo a ser demasiado, y por dentro vives en una cárcel construida por todas las veces que creíste que ser auténtica era un peligro.",
    shadow:"No es humildad, es una herida que aprendiste a llamar virtud.",
    gift:"Este personaje te protegió de verdad. Cuando eras niña, hacerte pequeña fue lo más inteligente que podías hacer y te funcionó: te evitó castigos, te dio paz y te mantuvo a salvo. Eso no fue debilidad, fue estrategia. Lo que ya no funciona es seguir usando una estrategia de sobrevivencia en una vida donde el peligro ya pasó.",
    notKnew:"Callarte no es falta de carácter, es un reflejo. Tu cuerpo aprendió que ser vista traía consecuencias, y hoy anticipa el rechazo antes de que exista, a una velocidad que tu mente no alcanza a discutir. Por eso proponerte hablar más nunca alcanza: lo que hay que desmontar es la creencia de que aparecer es peligroso.",
    costBlood:"Este personaje no te cobra en escándalos, te cobra en lo que no dijiste, en lo que aceptaste y en lo que dejaste de intentar, y esa cuenta se paga en silencio durante años.",
    costs:["Me guardo lo que pienso para no incomodar y después me pesa","Digo que sí cuando por dentro estoy diciendo que no","Siento un resentimiento que no sé dónde poner","Me da miedo ocupar espacio, incluso donde me lo gané","La gente cercana no sabe realmente lo que siento","Hago mis sueños más pequeños antes de intentarlos","Me molesta que no me vean y a la vez me esfuerzo por no ser vista","Después de una conversación repaso todo lo que no dije"],
    teaser3:"Hay tres momentos donde ella toma el volante sin pedirte permiso: cuando ibas a decir lo que pensabas y decide que mejor no, cuando algo te dolió y decide que no era tan grave, y cuando algo bueno te pasa y decide que no hay que contarlo mucho para que nadie se incomode.",
    manifestations:"Ella cede aunque algo le duela, se minimiza en las conversaciones y contesta que todo está bien cuando no lo está. Habla bajito, no por timidez sino por costumbre, y después de cada conversación repasa en silencio todo lo que no dijo.",
    phrases:"'No quiero causar problemas.' 'Mejor no digo nada.' 'No es tan grave, yo puedo aguantar.' 'Si me muestro mucho, seguro me critican.'",
    futureBlock:"El resentimiento silencioso se va acumulando hasta que un día explota, o se convierte en algo que ya no puedes ignorar, y lo que te bloquea no es el mundo, eres tú eligiendo no aparecer.",
    liberation:"Esta es la revelación que el personaje nunca quiso que leyeras: nadie te está pidiendo que seas menos, la única persona que sigue firmando ese contrato eres tú, cada día, por miedo a un rechazo que pasó hace décadas y que sigues reviviendo como si fuera hoy. Aquella niña que era demasiado no tenía nada malo, le tocó gente que no supo recibirla, que es algo muy distinto. Hoy tienes algo que ella no tenía y es la capacidad de elegir: cada vez que te achicas le confirmas a esa niña que tenía razón en esconderse, y cada vez que ocupas tu lugar la liberas un poco más. Tu presencia nunca fue el problema, tu ausencia es lo que te está costando la vida."},
  proveedora:{name:"La Proveedora",tag:"Valgo por lo que produzco",
    whoIs:["Ella no es ambiciosa ni adicta al trabajo por gusto, aunque eso es lo que se ve en su agenda. Es la que aprendió que el valor se demuestra y que quien no produce no cuenta.", "Su trabajo es no parar. Convierte el descanso en pendiente, la culpa en combustible y cualquier logro en el punto de partida del siguiente. Y cada vez que alguien te felicita por todo lo que haces, ella confirma que el sistema funciona y se queda otro año más.", "Y no es tu ética de trabajo. Es una identidad construida sobre el hacer, y sin el hacer no sabe existir."],
    birth:["Ella nace en una casa donde a una niña la miraban cuando rendía. Puede que hubiera aplausos por las notas, exigencia por los resultados, o simplemente un silencio que solo se rompía cuando había algo que celebrar.", "Esa niña entendió la ecuación en un segundo: si produzco, existo. Y no se equivocó, porque le funcionó, y cada logro traía la mirada que le faltaba, aunque durara poquísimo.", "Por eso hoy descansar no se te siente como merecido, se te siente como riesgo. No es adicción al trabajo, es ella evitando la única pregunta que todavía no tiene respuesta: quién eres cuando no estás produciendo."],
    gaveLine:"Tu disciplina construyó cosas reales. Eso no se discute.",
    takesLine:"Y te lo cobra en la única moneda que no se recupera, que es tu tiempo vivido.",
    keepsLine:"No va a pasar una tragedia. Va a pasar otro año agotada y al día.",
    withoutLine:"Imagínate un día entero sin producir nada y sentir, por primera vez, que igual valiste. Eso es lo que hay del otro lado.",
    gaveB:["Una disciplina que la mayoría de la gente no tiene", "La capacidad de sostener tu palabra sin importar cómo estés", "Independencia, y todo lo que compraste con ella", "Que nunca te hayas quedado esperando que alguien te resuelva", "Buena parte de lo que hoy tienes construido"],
    takesNote:"Esto no se ve por fuera, porque por fuera lo que se ve es una mujer que puede con todo. Puede que reconozcas una, puede que reconozcas todas.",
    takesB:["Culpa cada vez que descansas", "Un cuerpo que avisa y al que le pides más", "Logros que a los dos días ya no significan nada", "No saber quién eres cuando no estás produciendo", "La sensación permanente de estar atrasada en algo", "Estar presente a medias, siempre en lo que falta", "Una agenda llena y una vida vacía"],
    withoutB:["Descansas sin negociarlo con la culpa", "Terminas algo y te da tiempo de disfrutarlo", "Tu cuerpo deja de ser un empleado y vuelve a ser tu casa", "Puedes estar quieta sin sentir que estás perdiendo", "La gente te conoce por quién eres, no por lo que entregas", "Sigues siendo capaz y disciplinada, pero al servicio de tu vida", "Empiezas a saber qué quieres, no solo qué falta"],
    keepsB:["Te sigue cobrando en salud, que es la única cuenta que no se puede refinanciar", "Los años que pasan mientras esperas tener tiempo", "Las personas que estaban ahí mientras tú estabas ocupada", "El gozo, archivado como algo improductivo", "Y la mujer que ibas a ser, en la lista de pendientes"],
    rev:["Nada de lo que acabas de leer define quién eres hoy. Es el mapa de tu pasado, y el resto de tu historia arranca justo aquí.", "Toda la vida creíste que tu valor se demuestra, y es mentira. Llevas años trabajando para ganarte un amor que ya era tuyo, porque nadie te iba a querer más por producir más: eso fue lo que entendió una niña a la que solo miraban cuando rendía, y esa niña sigue administrando tu agenda el día de hoy.", "Y hay algo que ella nunca quiso que supieras: ninguna meta te llena porque no estás persiguiendo logros, estás persiguiendo una mirada que te faltó, y esa mirada no está en el próximo proyecto. Tu valor no se produce, se reconoce, y eres valiosa quieta, en silencio y sin nada que mostrar.", "Tú no naciste siendo ella, naciste mucho antes, cuando jugabas sin que eso sirviera para nada, y esa niña sigue ahí adentro esperando que alguien le diga que no tiene que ganarse el derecho a estar.", "Este es el umbral, y de este lado está la vida que se mide mientras del otro lado está la que se vive."],
    step:{"title": "Nómbrala", "body": ["Durante los próximos siete días, cada vez que sientas la culpa de estar descansando o la urgencia de empezar lo siguiente antes de terminar de respirar, para tres segundos y nómbrala: esta es ella, no soy yo.", "No te obligues a cambiar nada, no te regañes y no te exijas hacerlo distinto todavía. Solo sepáralas.", "Eso es todo, y no es poco: es el primer movimiento de la Ingeniería de Identidad, porque un personaje solo tiene poder mientras pasa por ti sin nombre. En el momento en que lo nombras deja de ser tú y se convierte en algo que puedes observar, y todo lo que se puede observar se puede soltar."]},
    painHook:"Porque desde muy niña te enseñaron que tu valor estaba en lo que hacías y no en lo que eras, con rendimiento, disciplina y resultados, porque cuando no producías nadie te miraba. Entonces convertiste el trabajo en tu identidad y hoy no sabes cómo existir sin estar haciendo.",
    core:"Tu rol es funcionar, producir y sostener, así que el descanso te genera culpa y la inactividad te inquieta. Tu cuerpo lleva tiempo pidiendo tregua, pero tu mente le exige cada vez más.",
    shadow:"No es ambición, es una identidad construida sobre el hacer, y sin el hacer no sabes existir.",
    gift:"Este personaje te construyó una vida. Tu disciplina, tu capacidad de sostener y tu palabra son reales, y buena parte de lo que tienes hoy existe porque él no te dejó rendirte. El problema no es tu capacidad de trabajar, es que se volvió lo único que te sostiene y hoy no sabes cómo valer sin estar produciendo.",
    notKnew:"El descanso no te incomoda por costumbre, te incomoda porque cuando paras aparece la pregunta de quién eres sin producir, y esa pregunta todavía no tiene respuesta. Producir no es tu ambición, es tu forma de no encontrarte con ese vacío, y por eso cada logro te calma unas horas y después necesitas otro.",
    costBlood:"Este personaje te cobra en la única moneda que no se recupera, y es el tiempo vivido, porque llenas los días de tareas y al final del año te cuesta encontrar un solo momento que hayas habitado de verdad.",
    costs:["Descansar me da culpa","Mi cuerpo me está avisando y yo sigo empujando","Logro algo y a los dos días ya no significa nada","No sé quién soy cuando no estoy produciendo","Vivo con la sensación de estar atrasada en algo","Me cuesta estar presente, siempre estoy en lo que falta","Mi agenda está llena y yo estoy vacía","Pensar en parar me da más miedo que seguir"],
    teaser3:"Hay tres momentos donde ella toma el volante sin pedirte permiso: cuando terminas algo importante y a las dos horas ya está armando lo siguiente, cuando tu cuerpo pide tregua y ella negocia un poco más, y cuando te sientas a descansar y te convierte el descanso en una tarea que también hay que hacer bien.",
    manifestations:"Ella llena la agenda hasta que no cabe nada, no celebra lo que logra porque ya está en lo próximo y convierte el ocio en algo productivo. Mide los días por lo que rindieron y no por lo que se vivió, y cuando alguien pregunta cómo estás, responde con lo que estás haciendo.",
    phrases:"'No puedo parar ahora, después descanso.' 'Si dejo de producir, dejo de merecer.' 'Necesito demostrar que valgo.' 'Todo depende de mí.'",
    futureBlock:"El burnout no avisa, llega cuando ya no puedes más, y entonces todo lo que construiste se siente como una condena en vez de un logro.",
    liberation:"La revelación es esta, y te pido que la leas dos veces: llevas toda la vida trabajando para ganarte un amor que ya era tuyo. Nadie te iba a querer más por producir más, eso fue lo que entendió una niña a la que solo miraban cuando rendía, y esa niña sigue administrando tu agenda el día de hoy. Por eso ninguna meta te llena, porque no estás persiguiendo logros, estás persiguiendo una mirada que te faltó, y esa mirada no está en el próximo proyecto. Tu valor no se produce, se reconoce, y el día que te lo creas el descanso deja de ser una amenaza y tu vida deja de ser una lista de pendientes. Eres valiosa quieta, en silencio y sin nada que mostrar, y mientras no lo veas el personaje te va a seguir cobrando en salud lo que no te atreves a cobrarte en verdad."},
  exitosaVacia:{name:"La Exitosa Vacía",tag:"Lo tengo todo y no siento nada",
    whoIs:["Ella no es una malagradecida ni una mujer que no valora lo que tiene, aunque eso es justo lo que temes en silencio. Es la que cumplió un plan al pie de la letra y llegó a la cima de una montaña que no había elegido.", "Su trabajo es mantener la fachada: que se vea impecable, que nadie se preocupe y que la respuesta a cómo estás siempre sea bien. Y cada vez que alguien dice qué envidia tu vida, ella confirma que la fachada funciona y se queda otro año más.", "Y no es que no sepas disfrutar. Es que construiste con el plano de otra persona y ahora vives en esa casa y no se siente tuya."],
    birth:["Ella nace en un lugar donde a una niña le entregaron un mapa muy claro de lo que era una buena vida: estudiar esto, lograr aquello, casarse, tener, llegar. Y ella fue tan capaz que lo cumplió completo.", "Nadie le preguntó nunca si ese mapa era el suyo, y ella tampoco preguntó, porque preguntar habría sido de malagradecida y porque mientras hubiera una meta pendiente la pregunta no aparecía.", "Por eso el vacío no te llegó cuando fracasaste, te llegó cuando lograste. No es tristeza sin motivo, es ella quedándose sin trabajo, y cuando ella se queda sin trabajo sale a la superficie todo lo que estaba debajo."],
    gaveLine:"Llegar tan lejos no fue suerte, fue capacidad tuya.",
    takesLine:"Y te lo cobra justo donde nadie mira, porque a ti todo te va bien.",
    keepsLine:"No va a pasar una tragedia. Va a pasar otro logro que tampoco se siente.",
    withoutLine:"Imagínate mirar tu propia vida y que por fin se sienta tuya, con todo lo que ya construiste adentro. Eso es lo que hay del otro lado.",
    gaveB:["Una capacidad de ejecución que muy poca gente tiene", "Resultados reales, que nadie te puede quitar", "Independencia y opciones que otras mujeres no tienen", "La certeza de que cuando decides algo, lo logras", "Una vida que desde afuera se ve bien porque también tiene cosas buenas"],
    takesNote:"Esto no se ve por fuera, y ahí está lo peor, porque a la mujer a la que todo le va bien nadie le pregunta cómo está. Puede que reconozcas una, puede que reconozcas todas.",
    takesB:["Tener lo que querías y no sentir lo que esperabas sentir", "Que te feliciten y por dentro no creerlo", "No permitirte quebrarte delante de nadie", "Vínculos que se quedaron en la superficie", "La pregunta de para qué construiste todo esto", "No saber qué quieres, solo qué se espera de ti", "Llorar sola y funcionar al día siguiente como si nada"],
    withoutB:["Disfrutas lo que ya tienes, porque dejas de necesitarlo para valer", "Dices que no estás bien y no se cae nada", "Empiezas a elegir por deseo y no por expectativa", "Tus vínculos bajan de la superficie a lo real", "Sabes quién eres sin el aplauso, que es la única base que no se cae", "Descubres qué quieres, y resulta que sí había algo", "Sigues siendo capaz y exitosa, pero ahora en tu propia montaña"],
    keepsB:["El vacío no se llena con más logros, y cada logro nuevo lo hace más evidente", "La siguiente crisis no va a ser de cansancio, va a ser de sentido", "Los años que pasan en una vida que admiras y no habitas", "La gente que nunca llegó a conocerte", "Y la mujer que sí eras, todavía sin estrenar"],
    rev:["Nada de lo que acabas de leer define quién eres hoy. Es el mapa de tu pasado, y el resto de tu historia arranca justo aquí.", "Llevas tiempo pensando que algo anda mal contigo, y es exactamente al revés. El vacío que sientes es la prueba de que cumpliste al pie de la letra un sueño que nunca fue tuyo, y eso no se arregla escalando más alto, porque el problema jamás fue la altura, fue la montaña.", "Y hay algo que ella nunca quiso que supieras: no tienes que quemar tu vida para recuperarte. No se trata de tirar el éxito por la borda, se trata de dejar de habitarlo como un disfraz, y cuando descubres quién eres sin el aplauso, todo lo que construiste por fin se puede disfrutar.", "Tú no naciste siendo ella, naciste mucho antes, cuando querías cosas sin averiguar primero si estaba bien quererlas, y esa mujer sigue ahí adentro esperando que le preguntes qué quiere.", "Este es el umbral, y de este lado está una vida impresionante mientras del otro lado está una vida tuya."],
    step:{"title": "Nómbrala", "body": ["Durante los próximos siete días, cada vez que te descubras respondiendo que estás bien sin haberlo revisado, o justificando un reconocimiento en lugar de recibirlo, para tres segundos y nómbrala: esta es ella, no soy yo.", "No te obligues a cambiar nada, no te regañes y no te exijas hacerlo distinto todavía. Solo sepáralas.", "Eso es todo, y no es poco: es el primer movimiento de la Ingeniería de Identidad, porque un personaje solo tiene poder mientras pasa por ti sin nombre. En el momento en que lo nombras deja de ser tú y se convierte en algo que puedes observar, y todo lo que se puede observar se puede soltar."]},
    painHook:"Lo lograste todo, el título, el puesto, el dinero y el reconocimiento, y aun así hay un silencio que nadie ve. Por fuera eres el ejemplo, pero por dentro te preguntas si esto era todo, porque construiste según el plano de otra persona y ahora vives en esa casa y no se siente tuya.",
    core:"Lo tienes todo menos a ti, porque este personaje no nació del éxito, nació de la herida de no sentirte suficiente.",
    shadow:"No es ingratitud, es que el mapa que seguiste nunca fue el tuyo.",
    gift:"Este personaje cumplió. Te llevó lejos, te dio resultados que muchas mujeres quisieran y una capacidad de ejecución que no es común. Nada de eso hay que tirarlo por la borda. Lo que sí hay que revisar es para quién lo construiste, porque una vida impresionante y una vida tuya no siempre son la misma vida.",
    notKnew:"El vacío no aparece cuando fracasas, aparece cuando logras, y ahí está la trampa. Mientras hay una meta pendiente el personaje tiene trabajo y todo se sostiene, pero al conseguirla se queda sin función y sale a la superficie lo que estaba debajo. Por eso tu peor momento no fue una crisis, fue un logro.",
    costBlood:"Este personaje no te cobra en dinero ni en logros, te cobra en la posibilidad de sentir lo que ya tienes, y por eso cada meta nueva llega, se celebra y se va sin dejarte nada adentro.",
    costs:["Tengo lo que quería y no siento lo que esperaba sentir","Me felicitan y por dentro no me lo creo","No me permito quebrarme delante de nadie","Mis vínculos se quedaron en la superficie","Me pregunto para qué construí todo esto","No sé qué quiero, solo sé lo que se espera de mí","Lloro sola y al día siguiente funciono como si nada","Me da miedo descubrir que esto no era lo que quería"],
    teaser3:"Hay tres momentos donde ella toma el volante sin pedirte permiso: cuando recibes un aplauso y por dentro no suena a nada, cuando alguien te dice qué envidia tu vida y tú piensas si supieran, y cuando estás sola sin distracciones y aparece una pregunta que decides no terminar de formular.",
    manifestations:"Ella se mantiene ocupada para que la pregunta no alcance, justifica cada reconocimiento que recibe y no celebra nada, porque celebrar sería admitir que ya llegó. Se quiebra en privado y al día siguiente funciona impecable, y mantiene los vínculos en un nivel donde nadie pueda ver lo que hay debajo.",
    phrases:"'Lo tengo todo… pero me siento sola.' 'No puedo parar ahora.' 'Me felicitan, pero no me conocen de verdad.' '¿Esto era todo? Pensé que se iba a sentir distinto.'",
    futureBlock:"La siguiente crisis no va a ser de cansancio, va a ser existencial, con una pregunta que no tiene respuesta en los logros: ¿para qué construí todo esto?",
    liberation:"Aquí está la revelación completa: el vacío que sientes no es señal de que algo ande mal contigo, es la prueba de que cumpliste al pie de la letra un sueño que nunca fue tuyo. Te entregaron un mapa a los veinte y fuiste tan capaz que llegaste a la cima, pero era la montaña equivocada, y eso no se arregla escalando más alto. La buena noticia que el personaje no quiere que sepas es que no tienes que quemar tu vida para recuperarte, porque no se trata de tirar el éxito por la borda, se trata de dejar de habitarlo como un disfraz. Cuando descubres quién eres sin el aplauso, todo lo que construiste por fin se puede disfrutar, porque ya no lo necesitas para valer, y esa es la diferencia entre tener una vida impresionante y tener una vida tuya."},
  espiritualReprimida:{name:"La Espiritual Reprimida",tag:"Hablo de luz para no mirar mi sombra",
    adultez:true,
    rolLine:"Este personaje se instaló encima de algo más viejo, porque tú no llegaste a la espiritualidad desde cero. Llegaste desde un rol que traías de mucho antes, y la espiritualidad fue la única opción lógica que te quedó después de intentar lo tradicional, la terapia, los libros, el esfuerzo y la voluntad, y ver que nada de eso llegaba al fondo. No fue una huida, fue lo único que te sostuvo. Lo que hay que revisar hoy es el rol de abajo, porque es el que sigue mandando.",
    adultezLine:["Y aquí está lo que hace distinto a este personaje: a ella no la eligió una niña. La elegiste tú, ya adulta, después de años de preguntas sin respuesta y de un dolor que no tenía dónde ponerse.","Eso duele más de reconocer, porque fue una decisión tuya y no una herencia. Y al mismo tiempo es la mejor noticia del diagnóstico, porque lo que se eligió con conciencia se puede desandar con conciencia, y no llevas décadas sosteniéndola: llevas exactamente el tiempo que llevas buscando afuera lo que solo estaba adentro."],
    whoIs:["Ella no es una farsante ni una mujer que finge su espiritualidad, y esto quiero que quede clarísimo. Es la que encontró en la conciencia un lugar donde por fin no dolía, y lo convirtió en el escondite más elegante que ha tenido.", "Su trabajo es subir todo a la mente antes de que llegue al cuerpo. Traduce la rabia en aprendizaje, la tristeza en proceso y el conflicto en falta de conciencia del otro. Y cada vez que sales de algo difícil sin haber sentido nada, ella confirma que su método funciona y se queda otro año más.", "Y no es que tu camino sea falso. Es que la herramienta que te salvó terminó sirviéndote para no sentir, en lugar de para sentir más."],
    birth:["Ella nace en un momento donde ya no había de dónde agarrarse. Puede que fuera un duelo, una separación, una traición, o simplemente años de estar rota sin que nadie lo notara, y la espiritualidad llegó y te sostuvo de verdad.", "Y ahí hizo su cálculo: si logro elevarme por encima de esto, no me toca sentirlo. Y le funcionó, porque desde arriba todo se ve más ordenado, y porque el lenguaje de la luz es el único que permite evitar sin que parezca evasión.", "Por eso hoy sentir rabia no se te siente humano, se te siente como un retroceso. No es que hayas perdido el camino, es ella defendiéndose, porque el día que bajas al cuerpo ella se queda sin lugar donde vivir."],
    gaveLine:"Esa fe te sostuvo cuando no había nada más.",
    takesLine:"Y te lo cobra en humanidad, con las palabras más bonitas que existen.",
    keepsLine:"No va a pasar una tragedia. Va a pasar otro año en paz por fuera.",
    withoutLine:"Imagínate sentir rabia sin traducirla y descubrir que del otro lado de eso también hay paz, pero una que no hay que sostener. Eso es lo que hay del otro lado.",
    gaveB:["Un piso real en un momento en el que no tenías ninguno", "Una capacidad de observarte que muy poca gente desarrolla", "Herramientas que sí funcionan y que sí has usado", "Una fe que te sacó de lugares oscuros", "Una manera de mirar la vida que no cambiarías por nada"],
    takesNote:"Esto no se ve por fuera, porque por fuera lo que se ve es una mujer en paz. Puede que reconozcas una, puede que reconozcas todas.",
    takesB:["Decir que ya lo soltaste cuando por dentro sigue ahí", "Juzgarte por sentir rabia, miedo o tristeza", "Estudiar mucho sobre ti y conocerte poco", "Evitar conflictos y llamarlo cuidar tu paz", "Estar desconectada del cuerpo, del placer y del deseo", "Años de procesos y el mismo vacío intacto", "Proyectar calma estando agotada"],
    withoutB:["Sientes lo que hay sin tener que traducirlo primero", "Tu rabia deja de ser un retroceso y pasa a ser información", "Dices lo que te molesta en el momento, no tres meditaciones después", "Vuelves al cuerpo, y con él al placer y al deseo", "Tu espiritualidad deja de ser refugio y se vuelve fuerza", "Los vínculos se hacen reales, porque por fin hay alguien adentro", "Sigues siendo profunda y consciente, pero también humana"],
    keepsB:["La anestesia va a seguir funcionando hasta el día en que no alcance", "Lo que está debajo se acumula, no se disuelve", "El cuerpo va a seguir mandando avisos cada vez más fuertes", "Los vínculos se quedan en el nivel donde nadie te alcanza", "Y la mujer humana que eres, todavía sin permiso de existir"],
    rev:["Nada de lo que acabas de leer define quién eres hoy. Es el mapa de tu pasado, y el resto de tu historia arranca justo aquí.", "Todo este tiempo creíste que llegaste buscando despertar, y no fue así. Llegaste buscando un lugar donde no doliera, y lo encontraste, y por eso después de tanto curso, tanta meditación y tanto soltar sigues sintiendo el mismo vacío: porque la luz que persigues está enterrada exactamente en lo que no quieres mirar.", "Y hay algo que ella nunca quiso que supieras: tu rabia no es baja vibración, es información, y tu tristeza no es falta de conciencia, es una parte tuya pidiendo permiso para entrar. El día que bajas de la mente al cuerpo y te permites sentir lo humano completo, descubres que nunca necesitaste elevarte para sanar, necesitabas aterrizar.", "Tú no naciste siendo ella, naciste mucho antes, cuando llorabas sin explicarlo y te enojabas sin pedir disculpas, y esa mujer sigue ahí adentro esperando que la dejes ser humana.", "Este es el umbral, y de este lado está la paz que hay que sostener con esfuerzo mientras del otro lado está la que no hay que sostener."],
    step:{"title": "Nómbrala", "body": ["Durante los próximos siete días, cada vez que sientas el impulso de explicar, elevar o soltar una emoción antes de haberla sentido en el cuerpo, para tres segundos y nómbrala: esta es ella, no soy yo.", "No te obligues a cambiar nada, no te regañes y no te exijas hacerlo distinto todavía. Solo sepáralas.", "Eso es todo, y no es poco: es el primer movimiento de la Ingeniería de Identidad, porque un personaje solo tiene poder mientras pasa por ti sin nombre. En el momento en que lo nombras deja de ser tú y se convierte en algo que puedes observar, y todo lo que se puede observar se puede soltar."]},
    painHook:"Encontraste en la espiritualidad una tabla de salvación cuando estabas tan herida, tan rota y tan vacía que necesitabas algo que te sostuviera, y lo encontraste. Pero con el tiempo la espiritualidad se convirtió en un nuevo personaje, uno que habla de amor pero no se ama y que habla de luz pero no se permite ser humana.",
    core:"Meditas, visualizas, afirmas y estudias conciencia, pero por dentro sigues sintiéndote vacía o desconectada. Dices que todo pasa por algo cuando en realidad no te permites sentir el duelo, y vives alineada pero sin sentir, conectada pero sin habitar tu cuerpo.",
    shadow:"No es sabiduría, es represión disfrazada de conciencia, y cuando reprimes tu sombra también te alejas de tu luz verdadera.",
    gift:"Este personaje te sostuvo cuando nada más lo estaba haciendo. La espiritualidad te dio un piso en un momento donde no tenías ninguno, y eso es real, valioso y tuyo. Lo que cambió fue el uso: lo que empezó como refugio se volvió escondite, y hoy te sirve para no sentir en lugar de servirte para sentir más.",
    notKnew:"La espiritualidad y la evitación usan exactamente el mismo lenguaje, y por eso cuesta tanto distinguirlas. Soltar de verdad te deja el cuerpo tranquilo, y soltar como defensa te deja el cuerpo tenso y la mente ocupada buscando la siguiente respuesta. Tu cuerpo ya sabe cuál de las dos estás haciendo, aunque tu mente todavía lo discuta.",
    costBlood:"Este personaje te cobra en humanidad, y lo hace con las palabras más bonitas que existen, porque cada emoción que subes a la mente para no sentirla en el cuerpo es una parte tuya que se queda esperando afuera.",
    costs:["Digo que ya lo solté y por dentro sigue ahí","Me juzgo por sentir rabia o tristeza","Estudio mucho sobre mí y me conozco poco","Busco respuestas afuera cuando no me aguanto adentro","Evito conflictos y lo llamo cuidar mi paz","Me desconecté de mi cuerpo, del placer y del deseo","Llevo años en procesos y el vacío sigue igual","Proyecto calma y por dentro estoy agotada"],
    teaser3:"Hay tres momentos donde ella toma el volante sin pedirte permiso: cuando algo te dolió y en dos segundos ya le encontraste el aprendizaje, cuando alguien te falló y decidiste protegerte de su energía en lugar de decir lo que sentías, y cuando aparece la rabia y la juzgas antes de escucharla.",
    manifestations:"Ella usa frases espirituales como escudo, evita el conflicto y lo llama cuidar su paz, y explica cualquier dolor antes de haberlo sentido. Estudia, medita, se certifica y acumula herramientas, y busca la respuesta afuera cada vez que adentro se pone incómodo.",
    phrases:"'Todo es perfecto.' 'Ya lo trabajé, eso está sanado.' 'No debo engancharme, debo soltar.' 'Estoy bien.'",
    futureBlock:"Vas a seguir usando la espiritualidad como anestesia hasta el día en que la anestesia no alcance, y entonces lo que estaba debajo, la rabia, la soledad y el miedo, va a salir todo junto y sin filtro.",
    liberation:"La revelación que ningún retiro te ha dado es esta: no llegaste a la espiritualidad buscando despertar, llegaste buscando un lugar donde no doliera, y la convertiste en el escondite más elegante que has tenido. Por eso después de tanto curso, tanta meditación y tanto soltar sigues sintiendo el mismo vacío, porque la luz que persigues está enterrada exactamente en lo que no quieres mirar. Tu rabia no es baja vibración, es información, y tu tristeza no es falta de conciencia, es una parte tuya pidiendo permiso para entrar. El día que bajas de la mente al cuerpo y te permites sentir lo humano completo, lo lindo y lo feo, descubres que nunca necesitaste elevarte para sanar: necesitabas aterrizar."}
};
var ORDER=["controladora","salvadora","invisible","proveedora","exitosaVacia","espiritualReprimida"];

/* ================= TEST =================
   Ocho situaciones de vida. En cada una aparecen LAS SEIS opciones, una por personaje,
   para que siempre haya una que se parezca a ella y para que ninguno tenga ventaja.
   Se elige una y solo una: no existe la opción de no elegir, porque cada pregunta sin
   respuesta dejaba un hueco y el resultado terminaba calculado sobre datos incompletos.
   Entonces el porcentaje es literal: de las 8 situaciones, en cuántas se eligió a ese personaje. */
var QS=[
  {id:1,type:"m",text:"Hoy, si te lo preguntas de verdad, ¿cómo te sientes con tu vida?",opts:[

/* Nota: la pregunta de filtro de inversión se eliminó del opt-in a propósito.
   El diagnóstico se entrega completo primero y la decisión de invertir se toma
   al final, ya con el resultado en la mano. */

/* ================= SCORING (normalizado: cada personaje compite en igualdad) ================= */
/* Cada personaje aparece en distinta cantidad de preguntas. Sin normalizar, los que
   aparecen más veces ganaban casi siempre. Aquí se divide el puntaje obtenido entre
   el máximo que ese personaje podía sacar, así todos tienen la misma oportunidad. */
var STAT=(function(){
  /* Para cada personaje calculamos el puntaje promedio y la variación que tendría
     si alguien respondiera al azar. Luego el resultado se mide contra ESE promedio,
     así los seis personajes compiten en igualdad de condiciones. */
  var mean={},vari={};ORDER.forEach(function(k){mean[k]=0;vari[k]=0;});
  QS.forEach(function(q){
    if(q.type!=="i")return;
    var n=q.opts.length;
    ORDER.forEach(function(c){
      var vals=q.opts.map(function(o){return (o.chars||[]).indexOf(c)>=0?(o.w||0):0;});
      var m=vals.reduce(function(a,b){return a+b;},0)/n;
      var v=vals.reduce(function(a,b){return a+(b-m)*(b-m);},0)/n;
      mean[c]+=m;vari[c]+=v;
    });
  });
  var sd={};ORDER.forEach(function(k){sd[k]=Math.sqrt(vari[k])||1;});
  return{mean:mean,sd:sd};
})();
/* ================= PUNTAJE =================
   Suma directa: cada personaje tiene 5 afirmaciones y cada una vale 0, 1 o 2,
   así que las seis se miden en el mismo rango de 0 a 10 y ninguna respuesta se descarta.
   Los empates se resuelven por cantidad de respuestas fuertes, después por la pregunta
   de qué cambiarías, después por la de infancia. Todo con números, nada arbitrario. */
function scoreAll(answers,pref){
  var hits={},faced={},won={};
  ORDER.forEach(function(k){hits[k]=0;faced[k]=0;won[k]={};});
  var mood="",change="",age=0,origen="",bloques=0,disp=0,semilla=0,libres=0;
  answers.forEach(function(a){
    semilla+=(a.qid||0)*3+(a.oi||0)*7;
    var q=null;for(var i=0;i<QS.length;i++)if(QS[i].id===a.qid){q=QS[i];break;}
    if(!q)return;
    if(q.type==="r"){
      bloques++;
      var presentes=(q.items||[]).map(function(it){return it.char;});
      presentes.forEach(function(c){if(c in faced)faced[c]++;});
      var op=q.items[a.oi]||{},elegido=op.char;
      if(op.libre)libres++;
      if(elegido&&(elegido in hits)){
        hits[elegido]++;
        presentes.forEach(function(c){if(c!==elegido)won[elegido][c]=(won[elegido][c]||0)+1;});
      }
      return;
    }
    var o=q.opts?q.opts[a.oi]:null;if(!o)return;
    if(o.disp!==undefined)disp+=o.disp;
    if(q.type==="m"&&o.mood)mood=o.mood;
    if(q.type==="c"&&o.change)change=o.change;
    if(q.type==="d"&&o.age)age=o.age;
    if(q.type==="o"&&o.con)origen=o.con;
  });
  /* Cada personaje tiene exactamente una vía de desempate, para que ninguno salga
     favorecido ni castigado cuando dos quedan iguales. */
  var CHG={trato_conmigo:"invisible",carga:"controladora",relaciones:"salvadora",proposito:"exitosaVacia",sentir:"espiritualReprimida",descanso:"proveedora"};
  var ORG={parentification:"salvadora",hero:"controladora",invisible:"invisible",perfectionist:"proveedora",scapegoat:"exitosaVacia"};
  /* El orden de partida se rota según las respuestas de cada persona para que ningún
     personaje quede favorecido por estar primero en la lista. */
  var rot=semilla%ORDER.length;
  var base=ORDER.slice(rot).concat(ORDER.slice(0,rot));
  /* Primero se agrupa por conteo. Dentro de cada grupo empatado se resuelve con los
     puntos de los enfrentamientos directos entre los empatados, después con la pregunta
     de qué cambiarías, después con la de infancia. Todo son números, así que el orden
     es siempre el mismo para las mismas respuestas y no depende de nada arbitrario. */
  var grupos={};base.forEach(function(k){var h=hits[k];(grupos[h]=grupos[h]||[]).push(k);});
  var niveles=Object.keys(grupos).map(Number).sort(function(a,b){return b-a;});
  var sorted=[];
  niveles.forEach(function(h){
    var g=grupos[h];
    /* Como los seis compiten en todas las preguntas, los empates se resuelven con la
       pregunta de qué cambiarías y después con la de infancia. */
    g.sort(function(a,b){
      var pa=CHG[change]===a?1:0,pb=CHG[change]===b?1:0;
      if(pa!==pb)return pb-pa;
      return base.indexOf(a)-base.indexOf(b);
    });
    sorted=sorted.concat(g);
  });
  /* Si hubo pregunta de desempate, manda lo que ella eligió. */
  if(pref&&sorted.indexOf(pref)>0&&hits[pref]>=hits[sorted[0]]-1){
    sorted=[pref].concat(sorted.filter(function(k){return k!==pref;}));
  }
  /* Empate real arriba: cuando el segundo está igual o a una respuesta del primero. */
  var empate=(sorted.length>1&&hits[sorted[1]]>=hits[sorted[0]]-1&&hits[sorted[1]]>0)?[sorted[0],sorted[1]]:null;
  var priKey=sorted[0],maxP=faced[priKey]||8;
  var secKey=hits[sorted[1]]>=2?sorted[1]:null;
  var conPuntaje=sorted.filter(function(k){return hits[k]>0;});
  var meters=(conPuntaje.length?conPuntaje:[priKey]).slice(0,2).map(function(k){
    return{key:k,name:CHARS[k].name,hits:hits[k],den:faced[k]||8,
      w:Math.max(8,Math.round(hits[k]/(faced[k]||8)*100))};});
  /* Si no reconoció ninguna frase de infancia, no le inventamos un origen. */
  var constKey=origen||"";
  /* Señal baja: si el personaje más alto apenas asoma, se lo decimos en vez de
     presentarle una lectura contundente que no se sostiene. */
  var senal=hits[priKey]<=2?"baja":hits[priKey]<=3?"media":"clara";
  var nivel=hits[priKey]>=5?"alta":hits[priKey]>=3?"media":"baja";
  return{primaryKey:priKey,secondaryKey:secKey,constKey:constKey,
    primary:CHARS[priKey],secondary:secKey?CHARS[secKey]:null,constellation:CONST[constKey]||null,
    meters:meters,puntaje:hits[priKey],maxPuntaje:maxP,senal:senal,bloques:bloques,
    empate:empate,libres:libres,personajeResp:bloques-libres,
    avgPain:maxP?(hits[priKey]/maxP)*3:0,disp:disp,mood:mood,change:change,
    nivel:nivel,dest:nivel==="alta"?"whatsapp":"claridad",
    age:age,years:(age?(age>=58?"más de cincuenta años":age>=50?"más de cuarenta años":age>=40?"más de treinta años":"más de veinte años"):""),
    urgency:"",profession:""};
}

  var ch={controladora:0,salvadora:0,invisible:0,proveedora:0,exitosaVacia:0,espiritualReprimida:0};
  var cv={},pain=0,pn=0,disp=0,mood="",change="",age=0;
  var hits={};ORDER.forEach(function(k){hits[k]=0;});
  answers.forEach(function(a){
    var q=null;for(var i=0;i<QS.length;i++)if(QS[i].id===a.qid){q=QS[i];break;}
    if(!q)return;var o=q.opts[a.oi];if(!o)return;
    if(q.type==="i"){(o.chars||[]).forEach(function(c){if(c in ch){ch[c]+=(o.w||0);hits[c]++;}});if(o.con)cv[o.con]=(cv[o.con]||0)+1;}
    if(o.mood)mood=o.mood;
    if(o.age)age=o.age;
    if(o.change)change=o.change;
    if(o.pain!==undefined){pain+=o.pain;pn++;}
    if(o.disp!==undefined)disp+=o.disp;
  });
  /* puntaje relativo: 0 a 1 sobre el máximo posible de cada personaje */
  var rel={};ORDER.forEach(function(k){rel[k]=(ch[k]-STAT.mean[k])/STAT.sd[k];});
  var sorted=ORDER.map(function(k){return[k,rel[k],ch[k]];})
    .sort(function(a,b){return (b[1]-a[1])||(b[2]-a[2]);});
  var lo=sorted[sorted.length-1][1],hi=sorted[0][1],span=(hi-lo)||1;
  /* Cuántas preguntas del test miden patrón: es el denominador honesto. */
  var NPAT=QS.filter(function(q){return q.opts.some(function(o){return (o.chars||[]).length>0;});}).length;
  var maxHit=1;ORDER.forEach(function(k){if(hits[k]>maxHit)maxHit=hits[k];});
  var meters=sorted.filter(function(s){return hits[s[0]]>0;}).slice(0,4).map(function(s){
    return{key:s[0],name:CHARS[s[0]].name,hits:hits[s[0]],npat:NPAT,w:Math.max(14,Math.round(hits[s[0]]/maxHit*100))};});
  var priKey=sorted[0][0];
  var secKey=sorted[1][1]>=sorted[0][1]*0.62?sorted[1][0]:null;
  var tcArr=Object.keys(cv).map(function(k){return[k,cv[k]];}).sort(function(a,b){return b[1]-a[1];});
  var constKey=tcArr.length?tcArr[0][0]:"hero";
  var avgPain=pn>0?pain/pn:0;
  /* Ruteo sin pregunta de filtro: la intensidad de las respuestas define el camino principal.
     De todas formas las dos puertas quedan visibles al final para que ella elija. */
  var nivel=(avgPain>=2.45&&disp>=13)?"alta":(avgPain>=2.10&&disp>=10)?"media":"baja";
  var dest=nivel==="alta"?"whatsapp":"claridad";
  return{primaryKey:priKey,secondaryKey:secKey,constKey:constKey,primary:CHARS[priKey],secondary:secKey?CHARS[secKey]:null,constellation:CONST[constKey],
    meters:meters,avgPain:avgPain,disp:disp,mood:mood,change:change,nivel:nivel,dest:dest,
    age:age,years:(age?(age>=58?"más de cincuenta años":age>=50?"más de cuarenta años":age>=40?"más de treinta años":"más de veinte años"):""),
    urgency:"",profession:""};
}

    +(p.adultez
      ?'<div class="rv" style="margin-top:34px;padding-top:28px;border-top:1px solid rgba(250,244,232,.2)">'

    +'</div>')
  /* 6. cómo opera: acordeones */
  +'<div class="light" style="padding:74px 0"><div class="wrap">'
  +'<p class="kicker rv" style="margin-bottom:26px">Tercera parte · Cómo opera por dentro</p>'
